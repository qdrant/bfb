# Example bfb upload config for a simple hybrid (dense + sparse) collection:
# one 768-d dense vector with turbo-2bit quantization and one zipf-distributed
# sparse vector, plus a couple of payload fields to filter on.
#
#   bfb upload --file examples/simple-hybrid.yaml -n 1M -b 256 -p 16 -t 8 \
#       --uri http://localhost:6334

collection:
  name: benchmark
  id: uuid
  on_disk_payload: true

  optimizers:
    default_segment_number: 3

  quantization:
    type: turbo-2bit
    always_ram: true

  vectors:
    - name: image
      size: 768
      distance: cosine
      datatype: float32
      on_disk: true
      source: random

  sparse_vectors:
    - name: bm25
      on_disk: true
      source:
        type: random
        vocab_size: 100000
        length: 100
        distribution: zipf

  fields:
    - name: a
      type: keyword
      source:
        type: random
        cardinality: 10
        values_per_point: 1
    - name: b
      type: float
      source: { type: random, min: -1.0, max: 1.0 }

