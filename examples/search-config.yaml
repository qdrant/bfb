# Example bfb search config.
#
#   bfb search --example search-config -n 50k -p 8 -t 4 \
#       --search-batch-size 4 --uri http://localhost:6334
#
# The YAML describes the *shape* of search requests; the CLI flags above
# control *how* the benchmark runs (query count, batch size, parallelism, …).
#
# Pair this with `--example upload-config`: upload first, then search the
# same collection without re-aligning legacy flags.

collection:
  name: benchmark

requests:
  # Dense search against the `image` named vector (1024-d, from upload config).
  - kind: dense
    using: image
    size: 1024
    datatype: float32
    source: random

  # Sparse search against the `bm25` sparse vector.
  - kind: sparse
    using: bm25
    source:
      type: random
      vocab_size: 100000
      length: 1000
      distribution: zipf

  # Same sparse search, but IDF statistics are computed over a sub-corpus
  # (Qdrant 1.19+) instead of the whole collection — the multi-tenant case.
  # Only meaningful for sparse vectors created with the IDF modifier.
  - kind: sparse
    using: bm25
    source:
      type: random
      vocab_size: 100000
      length: 1000
      distribution: zipf
    idf_corpus:
      - name: color
        type: keyword
        source: { type: random, cardinality: 100 }

  # Dense search with a keyword filter on the `color` payload field.
  - kind: dense
    using: text-emb
    size: 384
    source: random
    filters:
      - name: color
        type: keyword
        source:
          type: random
          cardinality: 100

  # Prefix filter on `color`: matches every keyword starting with the first 9
  # characters of a generated value, so a shorter prefix is less selective.
  # Requires the field's keyword index to be created with `prefix: true`.
  - kind: dense
    using: image
    size: 1024
    source: random
    filters:
      - name: color
        type: keyword
        source: { type: random, cardinality: 100 }
        match_prefix: 9

  # Filtered search using an integer range on `price`.
  - kind: dense
    using: image
    size: 1024
    source: random
    filters:
      - name: price
        type: integer
        source: { type: random, min: 0, max: 1000000 }
