# Example upload config with an inline dataset definition.
#
#   bfb upload --example upload-dataset-config -b 256 -p 16 -t 8 \
#       --uri http://localhost:6334
#
# Omit `-n` to upload the full dataset (capped by the smallest configured source).
# Datasets are downloaded on first use into `./datasets/` (override with BFB_DATASETS_DIR).

collection:
  name: glove-25-angular
  vectors:
    - size: 25
      distance: cosine
      source:
        type: dataset
        name: glove-25-angular
        format: h5
        path: glove-25-angular/glove-25-angular.hdf5
        link: http://ann-benchmarks.com/glove-25-angular.hdf5
