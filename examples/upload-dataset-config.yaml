# Example upload config using vector-db-benchmark datasets.
#
#   bfb upload --file examples/upload-dataset-config.yaml -b 256 -p 16 -t 8 \
#       --uri http://localhost:6334
#
# Omit `-n` to upload the full dataset (capped by the smallest configured source).
# Datasets are downloaded on first use into `./datasets/` (override with BFB_DATASETS_DIR).

collection:
  name: glove-100-angular
  vectors:
    - size: 100
      distance: cosine
      source:
        type: dataset
        name: glove-100-angular
