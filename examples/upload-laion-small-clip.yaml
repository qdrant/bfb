# Example upload config for the `laion-small-clip` dataset.
#
# In addition to the dense vectors, this uploads the dataset's payload objects
# and builds a float field index on `similarity` (matching the dataset's
# `"schema": { "similarity": "float" }` in vector-db-benchmark).
#
#   bfb upload --example upload-laion-small-clip -b 256 -p 16 -t 8 \
#       --uri http://localhost:6334
#
# Omit `-n` to upload the full dataset (capped by the smallest configured source).
# Datasets are downloaded on first use into `./datasets/` (override with BFB_DATASETS_DIR).
# The `.tgz` is extracted into `datasets/laion-small-clip/laion-small-clip/`
# (containing `vectors.npy` and `payloads.jsonl`).

collection:
  name: laion-small-clip
  vectors:
    - size: 512
      distance: cosine
      source:
        type: dataset
        name: laion-small-clip
        format: tar
        path: laion-small-clip/laion-small-clip
        link: https://storage.googleapis.com/ann-filtered-benchmark/datasets/laion-small-clip.tgz

  # Whole-payload source: every point's entire payload object is loaded from the
  # dataset's `payloads.jsonl`. Fields not listed under `fields` are still
  # uploaded — just left unindexed.
  payload:
    source:
      type: dataset
      dataset:
        name: laion-small-clip
        format: tar
        path: laion-small-clip/laion-small-clip
        link: https://storage.googleapis.com/ann-filtered-benchmark/datasets/laion-small-clip.tgz

  fields:
    # Index-only declaration: the value comes from `payload.source` above, so no
    # per-field `source` is needed — this just builds the float index.
    - name: similarity
      type: float
