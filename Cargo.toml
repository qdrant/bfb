[package]
name = "bfb"
version = "0.1.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.101"
chrono = { version = "0.4.43", default-features = false, features = [
    "now",
    "std",
] }
clap = { version = "4.5.57", features = ["derive", "suggestions"] }
clap_autocomplete = "0.4.2"
ctrlc = "3.5.1"
futures = "0.3.31"
indicatif = "0.18.3"
memmap2 = "0.9.9"
qdrant-client = { git = "https://github.com/qdrant/rust-client", branch = "dev" }
rand = "0.9.2"
rand_distr = "0.5.1"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = "0.1.18"
uuid = { version = "1.20.0", features = ["serde", "v4"] }
env_logger = "0.11.8"
indicatif-log-bridge = "0.2.3"
tracing = { version = "0.1.44", features = ["log"] }

[profile.release]
lto = "fat"
codegen-units = 1