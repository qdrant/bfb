[package]
name = "bfb"
version = "1.9.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", default-features = false, features = [
    "now",
    "std",
] }
clap = { version = "4.5.49", features = ["derive", "suggestions"] }
clap_autocomplete = "0.4.2"
ctrlc = "3.5.0"
futures = "0.3.31"
indicatif = "0.18.0"
memmap2 = "0.9.8"
qdrant-client = { git = "https://github.com/qdrant/rust-client", branch = "dev" }
rand = "0.9.1"
rand_distr = "0.5.1"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = "0.1.17"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
env_logger = "0.11.8"
indicatif-log-bridge = "0.2.3"
tracing = { version = "0.1.41", features = ["log"] }
